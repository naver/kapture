[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kapture"
description = "Kapture is a pivot file format and Python toolkit for SfM and sensor-acquired data."
readme = "README.md"
version="1.1.11"
dependencies = [
        'dataclasses>=0.3',
        'numpy>=1.16',
        'numpy-quaternion>=2019.3.18.14.33.20',
        'numba>=0.42',
        'matplotlib>=3.0',
        'scipy>=1.10.1',
        'tqdm>=4.30',
        'Pillow>=8.1.1',
        'piexif==1.1.3',
        'requests>=2.21',
        'pyyaml>=5.1',
        'wcmatch>=5.0',
        'tabulate>=0.8.7',
        'pytz>=2021.1',
        'build>=1.0.3',
        'pytest'
]     # If project has dependencies


[project.optional-dependencies]
zed = ['pyzed']

[tool.setuptools]
packages = ['kapture', 'tools']


[project.scripts]
kapture_data_date_ranges="tools.kapture_data_date_ranges:print_command_line"
kapture_download_dataset="tools.kapture_download_dataset:kapture_download_dataset_cli"
kapture_extract_exif="tools.kapture_extract_exif:extract_exif_command_line"
kapture_export_colmap="tools.kapture_export_colmap:colmap_command_line"
kapture_export_image_list="tools.kapture_export_image_list:export_image_list_command_line"
kapture_export_ply="tools.kapture_export_ply:export_ply_command_line"
kapture_export_LTVL2020="tools.kapture_export_LTVL2020:export_ltvl2020_command_line"
kapture_export_openmvg="tools.kapture_export_openmvg:export_openmvg_command_line"
kapture_export_opensfm="tools.kapture_export_opensfm:export_opensfm_command_line"
kapture_export_ETH_MS_LTVL="tools.kapture_export_ETH_MS_LTVL:export_ETH_MS_LTVL_command_line"
kapture_export_depth_images="tools.kapture_export_depth_images:export_depth_images_command_line"
kapture_export_4seasons_pairs="tools.kapture_export_4seasons_pairs:export_4seasons_pairs_command_line"
kapture_import_nvm="tools.kapture_import_nvm:import_nvm_command_line"
kapture_import_utbm="tools.kapture_import_utbm:import_utbm_rosbag_command_line"
kapture_import_RIO10="tools.kapture_import_RIO10:import_rio10_command_line"
kapture_import_silda="tools.kapture_import_silda:import_silda_command_line"
kapture_import_colmap="tools.kapture_import_colmap:colmap_command_line"
kapture_import_rosbag="tools.kapture_import_rosbag:import_rosbag_command_line"
kapture_import_7scenes="tools.kapture_import_7scenes:import_7scenes_command_line"
kapture_import_bundler="tools.kapture_import_bundler:bundler_command_line"
kapture_import_openmvg="tools.kapture_import_openmvg:import_openmvg_command_line"
kapture_import_opensfm="tools.kapture_import_opensfm:import_opensfm_command_line"
kapture_import_12scenes="tools.kapture_import_12scenes:import_12scenes_command_line"
kapture_import_4seasons="tools.kapture_import_4seasons:import_4seasons_command_line"
kapture_import_image_list="tools.kapture_import_image_list:import_image_list_command_line"
kapture_import_stereolabs="tools.kapture_import_stereolabs:kapture_import_zed_command_line"
kapture_import_image_folder="tools.kapture_import_image_folder:import_image_folder_command_line"
kapture_import_virtual_gallery="tools.kapture_import_virtual_gallery:import_virtual_gallery_command_line"
kapture_import_RobotCar_Seasons="tools.kapture_import_RobotCar_Seasons:import_robotcar_seasons_command_line"
kapture_import_symphony_seasons="tools.kapture_import_symphony_seasons:import_symphony_seasons_command_line"
kapture_import_IDL_dataset_cvpr17="tools.kapture_import_IDL_dataset_cvpr17:import_idl_dataset_cvpr17_command_line"
kapture_import_Extended_CMU_Seasons="tools.kapture_import_Extended_CMU_Seasons:import_extended_cmu_seasons_command_line"
kapture_import_image_list_with_poses="tools.kapture_import_image_list_with_poses:import_image_list_with_poses_command_line"
kapture_upgrade_1_0_to_1_1="tools.kapture_upgrade_1_0_to_1_1:upgrade_1_0_to_1_1_command_line"
kapture_upgrade_1_0_to_1_1_inplace="tools.kapture_upgrade_1_0_to_1_1_inplace:upgrade_1_0_to_1_1_inplace_command_line"
kapture_upgrade_1_0_to_1_1_orphan_features="tools.kapture_upgrade_1_0_to_1_1_orphan_features:upgrade_1_0_to_1_1_orphan_features_command_line"
kapture_merge="tools.kapture_merge:merge_command_line"
