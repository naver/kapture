[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kapture"
description = "Kapture is a pivot file format and Python toolkit for SfM and sensor-acquired data."
readme = "README.md"
version="2.0.0"
requires-python = ">=3.10"
dependencies = [
        'jsonargparse[signatures]>=4.46',
        'numpy>=1.16',
        'numpy-quaternion>=2019.3.18.14.33.20',
        'numba>=0.42',
        'matplotlib>=3.0',
        'scipy>=1.10.1',
        'tqdm>=4.30',
        'Pillow>=8.1.1',
        'piexif==1.1.3',
        'requests>=2.21',
        'pyyaml>=5.1',
        'wcmatch>=5.0',
        'tabulate>=0.8.7',
        'pytz>=2021.1',
]


[project.optional-dependencies]
zed = ['pyzed']
ros2bag = ['rosbags>=0.10.9']
dev = ['pytest', 'build', 'flake8']

[tool.setuptools.packages.find]
include = ["kapture*"]


[project.scripts]
kapture_data_date_ranges="kapture.tools.kapture_data_date_ranges:main"
kapture_download_dataset="kapture.tools.kapture_download_dataset:main"
kapture_extract_exif="kapture.tools.kapture_extract_exif:main"
